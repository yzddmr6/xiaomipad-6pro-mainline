# Standard PPS fast charging on adapters that are not Xiaomi-branded.
#
# liuqin-mipps-auth clears pd_verifed whenever Xiaomi adapter authentication
# fails, which keeps a third-party PPS adapter at 9 V / about 12 W even though
# PPS itself negotiated.  --allow-unverified-adapter asserts pd_verifed for
# such adapters when the cable is rated for the current the high-voltage path
# draws (5 A e-marker, or adapter-side enforcement when the kernel exposes no
# cable identity) and the negotiated contract is PD_PPS.
#
# To return to strictly authentication-gated charging, delete this file (or
# the whole .d directory) and run:
#
#   systemctl daemon-reload
#   systemctl restart liuqin-mipps-auth.service
#
# See docs/FASTCHARGE.md.
[Service]
ExecStart=
ExecStart=/usr/bin/flock -n -E 0 /run/liuqin-mipps-auth.lock \
          /usr/local/libexec/liuqin-mipps-auth --timeout 4 --no-data-role-swap \
          --role-first --allow-unverified-adapter
