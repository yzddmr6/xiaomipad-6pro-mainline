# Enable standard PPS fast charging on adapters that cannot pass Xiaomi's
# private adapter authentication.
#
# liuqin-mipps-auth writes pd_verifed=0 whenever adapter authentication fails.
# Only Xiaomi-branded adapters can produce the expected digest, so a third-party
# PPS adapter always leaves pd_verifed at 0 and the firmware keeps the
# high-voltage charge path closed: the device negotiates PPS successfully but
# stays pinned at 9 V, roughly 12 W.
#
# --allow-unverified-adapter asserts pd_verifed=1 in that case, which unlocks the
# higher-voltage PPS contract.  Measured on liuqin with a 100 W third-party PPS
# adapter: 12 W -> about 39.6 W into the battery.
#
# This deliberately overrides the outcome of adapter authentication, so it is a
# separate, removable drop-in rather than part of the base unit.  To return to
# authentication-gated charging, delete this file (or the whole .d directory)
# and run:
#
#   systemctl daemon-reload
#   systemctl restart liuqin-mipps-auth.service
#
# See docs/FASTCHARGE.md for the full mechanism and its caveats.
[Service]
ExecStart=
ExecStart=/usr/bin/flock -n -E 0 /run/liuqin-mipps-auth.lock \
          /usr/local/libexec/liuqin-mipps-auth --timeout 4 --no-data-role-swap \
          --allow-unverified-adapter
