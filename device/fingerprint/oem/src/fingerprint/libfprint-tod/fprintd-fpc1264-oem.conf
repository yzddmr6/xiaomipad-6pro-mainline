# Requires the trusted program bundle and exact matching FPC module, loaded
# after desktop startup. Development installs may defer/unmask explicitly.
[Unit]
After=liuqin-fpc-stable-module.service
Wants=liuqin-fpc-stable-module.service
ConditionPathExists=/dev/fpc1020
ConditionPathExists=/usr/local/lib/liuqin-fpc-oem/tod/libfprint-tod-fpc1264-oem.so

[Service]
# Native fprintd enrollment must create templates accepted by the private
# adaptive-update writer, which requires root-owned mode 0600.
UMask=0077
ExecStart=
ExecStart=/usr/local/lib/liuqin-fpc-oem/fprintd
Environment=FP_LIUQIN_FPC1264_OEM_ENABLE=1
# The system libfprint also contains a built-in fpc1020 driver. Restrict this
# candidate daemon to the virtual OEM driver so it cannot probe the same SPI
# node through the unrelated legacy driver.
Environment=FP_DRIVERS_ALLOWLIST=fpc1264_oem
Environment=FP_TOD_DRIVERS_DIR=/usr/local/lib/liuqin-fpc-oem/tod
Environment=LIUQIN_FPC_OEM_RUNTIME=/usr/local/lib/liuqin-fpc-oem
RuntimeDirectory=liuqin-fpc-oem-runtime
RuntimeDirectoryMode=0700
# CLI and fprintd use the same lock and TA service files. Preserve them when
# fprintd exits; deleting a live lock inode would break shared exclusion.
RuntimeDirectoryPreserve=yes
StateDirectory=liuqin-fingerprint
StateDirectoryMode=0700
ReadWritePaths=/sys/module/firmware_class/parameters/path
DeviceAllow=/dev/fpc1020 rw
DeviceAllow=/dev/tee0 rw
DeviceAllow=/dev/teepriv0 rw
DeviceAllow=/dev/bsg/0:0:0:49476 rw
